<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Token by Token — Inference Lab. Hands-on episodes exploring model serving, optimization and measured trade-offs." />
    <script>
      (() => {
        const key = "token-by-token-theme";
        const stored = localStorage.getItem(key);
        const theme = stored === "light" || stored === "dark"
          ? stored
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/token-by-token.svg" />
    <title>Token by Token — Inference Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
