[project]
name = "inference-lab-episode-0"
version = "0.0.0"
description = "Local publication candidate for an exploratory inference runtime study"
requires-python = ">=3.12"

[project.optional-dependencies]
live = ["jinja2==3.1.6", "transformers==5.17.0"]
test = ["jsonschema==4.25.1", "packaging==26.3", "pytest==8.4.2", "zstandard==0.25.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
